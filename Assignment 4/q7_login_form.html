<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>body{font-family:system-ui,sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem;color:#222}
label{display:block;margin-top:1rem;font-weight:600}
input,select,textarea{width:100%;padding:.5rem;margin-top:.25rem;border:2px solid #bbb;border-radius:6px;box-sizing:border-box;font-size:1rem}
input.invalid{border-color:#d32f2f}input.valid{border-color:#2e7d32}
.error{color:#d32f2f;font-size:.85rem;min-height:1.1em;margin:.2rem 0 0}
button{margin-top:1.2rem;padding:.6rem 1.2rem;font-size:1rem;border:0;border-radius:6px;background:#1565c0;color:#fff;cursor:pointer}
.success{color:#2e7d32;font-weight:600;margin-top:1rem}
pre,.ticket{background:#f5f5f5;padding:1rem;border-radius:6px;margin-top:1rem;white-space:pre-wrap}</style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm" novalidate>
    <label for="username">Username</label><input id="username" name="username" type="text">
    <label for="password">Password</label><input id="password" name="password" type="password">
    <button type="submit">Login</button>
  </form>
  <div id="message"></div>
  <script src="q7_login_validation.js"></script>
</body>
</html>
