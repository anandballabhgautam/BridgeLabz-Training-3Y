<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q7 – Task Tracker</title>
  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Q7_Task_Tracker_Badges.css">
</head>
<body class="bg-light">
  <header class="bg-dark text-white py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Task Tracker</h1>
      <!-- Badge counter: total pending tasks. rounded-pill = fully rounded badge -->
      <span class="fs-6">Pending <span class="badge rounded-pill text-bg-warning">5</span></span>
    </div>
  </header>

  <main class="container">
    <section class="card shadow-sm">
      <div class="card-header fw-bold">Today's Tasks</div>

      <!-- list-group holds the tasks; each priority badge uses a contextual colour -->
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Finish Bootstrap assignment
          <span class="badge text-bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Push code to GitHub
          <span class="badge text-bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Review class notes
          <span class="badge text-bg-warning">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Reply to emails
          <span class="badge text-bg-warning">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Organise desktop files
          <span class="badge text-bg-success">Low</span>
        </li>
      </ul>

      <div class="card-footer text-end">
        <!-- Button with an embedded badge showing completed tasks -->
        <button type="button" class="btn btn-success">
          Completed <span class="badge text-bg-light">3</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="text-center text-muted py-4">
    <small>&copy; 2026 Task Tracker</small>
  </footer>
</body>
</html>
