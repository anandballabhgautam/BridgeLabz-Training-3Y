<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 – Image Showcase</title>
  <link rel="stylesheet" href="Q3_Image_Showcase.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
  </header>

  <main class="showcase">
    <figure>
      <div class="frame"><img src="images/gallery-1.svg" alt="Mountain Sunrise"></div>
      <figcaption>Mountain Sunrise</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="images/gallery-2.svg" alt="Ocean Breeze"></div>
      <figcaption>Ocean Breeze</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="images/gallery-3.svg" alt="Forest Trail"></div>
      <figcaption>Forest Trail</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="images/gallery-4.svg" alt="Twilight Sky"></div>
      <figcaption>Twilight Sky</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="images/gallery-5.svg" alt="Desert Dunes"></div>
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="images/gallery-6.svg" alt="Lake Reflection"></div>
      <figcaption>Lake Reflection</figcaption>
    </figure>
  </main>
</body>
</html>
