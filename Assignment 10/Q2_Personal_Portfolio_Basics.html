<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q2 – Personal Portfolio</title>
  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Q2_Personal_Portfolio_Basics.css">
</head>
<body class="bg-light text-dark">
  <!-- p-5 = padding, text-center = centred text, fw-bold = bold, bg-white = background colour -->
  <header class="bg-white p-5 text-center border-bottom">
    <div class="container">
      <h1 class="fw-bold">Your Name</h1>
      <p class="lead mb-0">Web Developer &amp; UI Designer</p>
    </div>
  </header>

  <main class="container text-center">
    <!-- mt-4 / mb-3 = margin top / bottom -->
    <section class="mt-4 mb-3">
      <!-- img-fluid = responsive image, rounded-circle = round shape -->
      <img src="images/profile.svg" alt="Profile photo" class="img-fluid rounded-circle profile-img shadow">
      <p class="mt-4 mx-auto bio">I build clean, responsive websites and enjoy turning ideas into simple, usable designs. Currently learning Bootstrap and JavaScript.</p>

      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="#contact" class="btn btn-primary btn-lg">Hire Me</a>
        <a href="#" class="btn btn-outline-dark btn-lg">Download CV</a>
      </div>
    </section>

    <section id="contact" class="my-5 p-5 bg-white border rounded">
      <h2 class="fw-bold mb-4">Contact Me</h2>
      <form class="mx-auto contact-form text-start" action="#" method="post">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <!-- form-control = full-width styled input -->
          <input type="text" class="form-control" id="name" placeholder="Your name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3" placeholder="How can I help?"></textarea>
        </div>
        <button type="submit" class="btn btn-dark w-100">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="text-center py-3 bg-dark text-white">
    <small>&copy; 2026 Your Name</small>
  </footer>
</body>
</html>
