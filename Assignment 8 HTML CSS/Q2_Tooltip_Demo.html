<!DOCTYPE html>

  <title>Q2 – CSS Tooltips</title>
  <link rel="stylesheet" href="Q2_Tooltip_Demo.css">

<body>
  <main class="stage">
    <h1>CSS-Only Tooltips</h1>
    <p>Hover over (or Tab to) each item.</p>

    <div class="items">
      <span class="tip" tabindex="0">
        &#127968; Home
        <span class="tip-text">Go back to the home page</span>
      </span>

      <span class="tip" tabindex="0">
        &#9881; Settings
        <span class="tip-text">Change your preferences</span>
      </span>

      <span class="tip" tabindex="0">
        &#128276; Alerts
        <span class="tip-text">You have 3 new notifications</span>
      </span>

      <span class="tip" tabindex="0">
        &#10068; Help
        <span class="tip-text">Find answers and support</span>
      </span>
    </div>
  </main>
</body>
</html>
