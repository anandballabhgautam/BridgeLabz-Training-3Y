<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 – Filter Comparison Layout</title>
  <link rel="stylesheet" href="Q8_Filter_Comparison_Layout.css">
</head>
<body>
  <header>
    <h1>Before &amp; After</h1>
    <p>Hover over the right image to fade the filter away.</p>
  </header>

  <main class="compare">
    <figure>
      <img src="images/compare.svg" alt="Original city sunset photo">
      <figcaption>Before: original image</figcaption>
    </figure>

    <figure>
      <img class="filtered" src="images/compare.svg" alt="City sunset photo with brightness and contrast filter">
      <figcaption>After: brightness + contrast filter</figcaption>
    </figure>
  </main>
</body>
</html>
