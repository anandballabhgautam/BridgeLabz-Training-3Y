<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q6 – CSS Photo Gallery</title>
  <link rel="stylesheet" href="Q6_Photo_Gallery.css">
</head>
<body>
  <header>
    <h1>Photo Gallery</h1>
  </header>

  <main class="gallery">
    <figure>
      <img src="images/gallery-1.svg" alt="Mountain Sunrise">
      <figcaption>Mountain Sunrise</figcaption>
    </figure>
    <figure>
      <img src="images/gallery-2.svg" alt="Ocean Breeze">
      <figcaption>Ocean Breeze</figcaption>
    </figure>
    <figure>
      <img src="images/gallery-3.svg" alt="Forest Trail">
      <figcaption>Forest Trail</figcaption>
    </figure>
    <figure>
      <img src="images/gallery-4.svg" alt="Twilight Sky">
      <figcaption>Twilight Sky</figcaption>
    </figure>
    <figure>
      <img src="images/gallery-5.svg" alt="Desert Dunes">
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure>
      <img src="images/gallery-6.svg" alt="Lake Reflection">
      <figcaption>Lake Reflection</figcaption>
    </figure>
  </main>
</body>
</html>
