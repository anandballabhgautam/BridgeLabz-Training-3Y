<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q7 – UI Components</title>
  <link rel="stylesheet" href="Q7_UI_Components.css">
</head>
<body>
  <main class="card">
    <h1>Quick Search</h1>

    <div class="row">
      <input type="search" id="search" placeholder="Search..." aria-label="Search">
      <button type="button" class="btn primary">Search</button>
    </div>

    <div class="row">
      <label for="category">Category</label>
      <select id="category">
        <option>All</option>
        <option>Articles</option>
        <option>Images</option>
        <option>Videos</option>
      </select>
    </div>

    <div class="row">
      <button type="button" class="btn secondary">Reset</button>
      <button type="button" class="btn primary">Apply</button>
    </div>
  </main>
</body>
</html>
