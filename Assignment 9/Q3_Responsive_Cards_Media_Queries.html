<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 – Responsive Cards with Media Queries</title>
  <link rel="stylesheet" href="Q3_Responsive_Cards_Media_Queries.css">
</head>
<body>
  <header>
    <h1>Responsive Cards</h1>
    <p>Resize the window to see 4, 2 or 1 columns.</p>
  </header>

  <main class="cards">
    <article class="card"><h2>Card One</h2><p>Cards use Flexbox and a calculated width.</p></article>
    <article class="card"><h2>Card Two</h2><p>Media queries change how many fit in a row.</p></article>
    <article class="card"><h2>Card Three</h2><p>Spacing stays equal at every breakpoint.</p></article>
    <article class="card"><h2>Card Four</h2><p>Hover to see the background colour change.</p></article>
  </main>
</body>
