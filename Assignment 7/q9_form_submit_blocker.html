<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signup Form</title>
  <style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem;color:#222}
input,textarea,button{font-size:1rem;font-family:inherit}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:.5rem;border:2px solid #bbb;border-radius:6px}
button{padding:.45rem .9rem;border:0;border-radius:6px;background:#1565c0;color:#fff;cursor:pointer}
button.secondary{background:#757575}button.danger{background:#c62828}
.error{color:#c62828;font-size:.85rem;min-height:1.1em;margin:.25rem 0}
.success{color:#2e7d32;font-weight:600}
label{font-weight:600;display:block;margin-top:.8rem}input.invalid{border-color:#c62828!important}
  </style>
</head>
<body>
  <h1>Signup Form</h1>
  <form id="signupForm" novalidate>
    <label for="name">Name</label><input type="text" id="name" name="name">
    <p class="error" id="nameError"></p>
    <label for="email">Email</label><input type="text" id="email" name="email">
    <p class="error" id="emailError"></p>
    <label for="password">Password</label><input type="password" id="password" name="password">
    <p class="error" id="passwordError"></p>
    <button type="submit">Submit</button>
  </form>
  <p class="success" id="successMessage"></p>
  <script src="q9_form_submit_blocker.js"></script>
</body>
</html>
