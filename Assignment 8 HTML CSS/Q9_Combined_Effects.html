<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 – Combined Effects</title>
  <link rel="stylesheet" href="Q9_Combined_Effects.css">
</head>
<body>
  <header>
    <h1>Pseudo-classes + Transitions + Transforms</h1>
    <p>Hover, click and Tab on each example.</p>
  </header>

  <main class="examples">
    <section class="example">
      <button type="button" class="grow-btn">Grow &amp; Colour</button>
      <p>Button grows and changes colour on hover.</p>
    </section>

    <section class="example">
      <a href="#" class="tilt-card">Tilt Card</a>
      <p>Card tilts and lifts on hover.</p>
    </section>

    <section class="example">
      <button type="button" class="press-btn">Press Me</button>
      <p>Hover lifts, :active presses it down.</p>
    </section>
  </main>
