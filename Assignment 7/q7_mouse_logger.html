<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouse Coordinates Logger</title>
  <style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem;color:#222}
input,textarea,button{font-size:1rem;font-family:inherit}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:.5rem;border:2px solid #bbb;border-radius:6px}
button{padding:.45rem .9rem;border:0;border-radius:6px;background:#1565c0;color:#fff;cursor:pointer}
button.secondary{background:#757575}button.danger{background:#c62828}
.error{color:#c62828;font-size:.85rem;min-height:1.1em;margin:.25rem 0}
.success{color:#2e7d32;font-weight:600}
#trackingBox{position:relative;width:400px;height:400px;border:2px solid #1565c0;background:#f5f9ff;cursor:crosshair;overflow:hidden;user-select:none}
.dot{position:absolute;width:12px;height:12px;background:red;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  </style>
</head>
<body>
  <h1>Mouse Coordinates Logger</h1>
  <p id="coordinates">Move the mouse inside the box</p>
  <p>Double-click inside the box to drop a red dot.</p>
  <div id="trackingBox"></div>
  <script src="q7_mouse_logger.js"></script>
</body>
</html>
