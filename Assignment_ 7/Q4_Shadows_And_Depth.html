<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 – Shadows and Depth</title>
  <link rel="stylesheet" href="Q4_Shadows_And_Depth.css">
</head>
<body>
  <header>
    <h1>Shadows &amp; Depth</h1>
  </header>

  <main class="cards">
    <article class="card soft">
      <h2>Soft Shadow</h2>
      <p>A light, blurred shadow gives a gentle floating look.</p>
    </article>

    <article class="card hard">
      <h2>Hard Shadow</h2>
      <p>No blur and a strong offset creates a bold, retro style.</p>
    </article>

    <article class="card glow">
      <h2>Glow Shadow</h2>
      <p>A coloured shadow with a large blur looks like a glow.</p>
    </article>
  </main>
</body>
</html>
