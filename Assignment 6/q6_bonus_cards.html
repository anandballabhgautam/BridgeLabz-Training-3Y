<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q6 Bonus - Product Cards</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f4f4f6; }
    h1 { text-align: center; }
    #product-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .product-card { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.15); text-align: center; }
    .product-card img { height: 160px; max-width: 100%; object-fit: contain; }
    .product-card h3 { font-size: 0.95rem; }
    .price { font-weight: bold; color: #0a7d32; }
    #message { text-align: center; color: #b00020; }
  </style>
</head>
<body>
  <h1>Products</h1>
  <p id="message"></p>
  <div id="product-container"></div>

  <script>
    "use strict";
    async function loadProducts() {
      const container = document.getElementById("product-container");
      const message = document.getElementById("message");
      try {
        const response = await fetch("https://fakestoreapi.com/products");
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        const products = await response.json();

        for (const product of products) {
          const card = document.createElement("div");
          card.className = "product-card";

          const image = document.createElement("img");
          image.src = product.image;
          image.alt = product.title;

          const title = document.createElement("h3");
          title.textContent = product.title;

          const price = document.createElement("p");
          price.className = "price";
          price.textContent = `$${product.price}`;

          card.append(image, title, price);
          container.appendChild(card);
        }
      } catch (error) {
        message.textContent = "Failed to load products. Please try again.";
      }
    }
    loadProducts();
  </script>
</body>
</html>
