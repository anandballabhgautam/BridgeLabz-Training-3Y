<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q6 – CSS Transformations</title>
  <link rel="stylesheet" href="Q6_CSS_Transformations.css">
</head>
<body>
  <header>
    <h1>CSS Transformations</h1>
    <p>Hover over each box.</p>
  </header>

  <main class="showcase">
    <figure class="item">
      <div class="box rotate">Rotate</div>
      <figcaption>rotate(45deg) turns the box</figcaption>
    </figure>

    <figure class="item">
      <div class="box scale">Scale</div>
      <figcaption>scale(1.4) makes it bigger</figcaption>
    </figure>

    <figure class="item">
      <div class="box translate">Translate</div>
      <figcaption>translate(0, -25px) moves it up</figcaption>
    </figure>

    <figure class="item">
      <div class="box skew">Skew</div>
      <figcaption>skew(20deg, 10deg) slants it</figcaption>
    </figure>
  </main>
</body>
</html>
