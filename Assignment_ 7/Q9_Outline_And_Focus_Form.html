<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 – Outline and Focus Form</title>
  <link rel="stylesheet" href="Q9_Outline_And_Focus_Form.css">
</head>
<body>
  <main class="page">
    <section class="samples">
      <h2>Outline Styles &amp; Offset</h2>
      <div class="sample-row">
        <div class="sample o-solid">solid</div>
        <div class="sample o-dashed">dashed</div>
        <div class="sample o-dotted">dotted</div>
        <div class="sample o-double">double</div>
      </div>
      <p class="hint">Offsets: 0px, 4px, 8px and 4px.</p>
    </section>

    <form action="#" method="post">
      <h2>Feedback Form</h2>

      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Click to focus">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">

      <label for="msg">Message</label>
      <textarea id="msg" name="message" rows="4" placeholder="Your message..."></textarea>
    </form>
  </main>
</body>
</html>
