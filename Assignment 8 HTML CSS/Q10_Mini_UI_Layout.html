<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q10 – Mini UI Layout</title>
  <link rel="stylesheet" href="Q10_Mini_UI_Layout.css">
</head>
<body>
  <header>
    <h1>Mini Profile Settings</h1>
  </header>

  <main>
    <section class="card">
      <img src="images/small.svg" alt="Mini UI illustration">

      <form action="#" method="post">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Your name">

        <label for="mail">Email</label>
        <input type="email" id="mail" name="mail" placeholder="you@example.com">

        <div class="actions">
          <button type="button" class="btn cancel">Cancel</button>
          <button type="submit" class="btn save">Save</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mini UI</p>
  </footer>
</body>
</html>
