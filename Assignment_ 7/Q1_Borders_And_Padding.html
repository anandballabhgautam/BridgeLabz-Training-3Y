<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 – Borders and Padding</title>
  <link rel="stylesheet" href="Q1_Borders_And_Padding.css">
</head>
<body>
  <header>
    <h1>Borders &amp; Padding Demo</h1>
    <p>Hover over any box to see the border colour change.</p>
  </header>

  <main>
    <section>
      <h2>Border Styles</h2>
      <div class="row">
        <div class="box solid">solid</div>
        <div class="box dashed">dashed</div>
        <div class="box double">double</div>
        <div class="box groove">groove</div>
      </div>
    </section>

    <section>
      <h2>Rounded Corners (border-radius)</h2>
      <div class="row">
        <div class="box r-small">8px</div>
        <div class="box r-large">30px</div>
        <div class="box r-circle">50%</div>
        <div class="box r-mixed">mixed</div>
      </div>
    </section>

    <section>
      <h2>Padding Values</h2>
      <div class="row">
        <div class="box p-small"><span>5px</span></div>
        <div class="box p-medium"><span>20px</span></div>
        <div class="box p-large"><span>40px</span></div>
        <div class="box p-mixed"><span>10px 40px</span></div>
      </div>
    </section>
  </main>
</body>
</html>
