<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 – Filter Cards with Animation</title>
  <link rel="stylesheet" href="Q5_Filter_Cards_Animation.css">
</head>
<body>
  <header>
    <h1>Meet the Team</h1>
  </header>

  <main class="cards">
    <article class="card">
      <img class="grayscale" src="images/profile-1.svg" alt="Profile of Riya">
      <h2>Riya</h2>
      <p>Team lead and project planner.</p>
    </article>

    <article class="card">
      <img class="sepia" src="images/profile-2.svg" alt="Profile of Aman">
      <h2>Aman</h2>
      <p>Frontend developer who loves CSS.</p>
    </article>

    <article class="card">
      <img class="grayscale" src="images/profile-3.svg" alt="Profile of Neha">
      <h2>Neha</h2>
      <p>Designer focused on simple interfaces.</p>
    </article>
  </main>
</body>
</html>
