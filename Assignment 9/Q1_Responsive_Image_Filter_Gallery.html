<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 – Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="Q1_Responsive_Image_Filter_Gallery.css">
</head>
<body>
  <header>
    <h1>Image Filter Gallery</h1>
    <p>Hover over an image to remove its filter.</p>
  </header>

  <main class="gallery">
    <figure>
      <div class="frame"><img class="f-blur" src="images/gallery-1.svg" alt="Mountain Sunrise with blur filter"></div>
      <figcaption>blur: Mountain Sunrise</figcaption>
    </figure>
    <figure>
      <div class="frame"><img class="f-grayscale" src="images/gallery-2.svg" alt="Ocean Breeze with grayscale filter"></div>
      <figcaption>grayscale: Ocean Breeze</figcaption>
    </figure>
    <figure>
      <div class="frame"><img class="f-sepia" src="images/gallery-3.svg" alt="Forest Trail with sepia filter"></div>
      <figcaption>sepia: Forest Trail</figcaption>
    </figure>
    <figure>
      <div class="frame"><img class="f-brightness" src="images/gallery-4.svg" alt="Twilight Sky with brightness filter"></div>
      <figcaption>brightness: Twilight Sky</figcaption>
    </figure>
    <figure>
      <div class="frame"><img class="f-contrast" src="images/gallery-5.svg" alt="Desert Dunes with contrast filter"></div>
      <figcaption>contrast: Desert Dunes</figcaption>
    </figure>
    <figure>
      <div class="frame"><img class="f-hue-rotate" src="images/gallery-6.svg" alt="Lake Reflection with hue-rotate filter"></div>
      <figcaption>hue-rotate: Lake Reflection</figcaption>
    </figure>
  </main>
</body>
</html>
